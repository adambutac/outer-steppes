# Runs on every pull request and on pushes to main. Nothing here needs a
# Discord or grok.com secret: the suite uses fakes, and gitleaks only reads git.
#
# Actions are pinned by full commit SHA, with the tag in a trailing comment. A
# tag can be moved to other code by whoever controls the action's repository;
# a SHA can't. Dependabot (.github/dependabot.yml) proposes the bumps. All
# three are on their Node 24 majors: GitHub removed Node 20 from its runners on
# 2026-09-16.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux exercises the POSIX file-mode checks; Windows is the dev machine.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[test]"
      # Both steps run under coverage.py (settings in pyproject.toml); the
      # second appends, so the report covers the whole suite on this OS.
      - name: Unit and handler tests
        run: python -m coverage run -m pytest -q -m "not integration"
      - name: Integration tests
        run: python -m coverage run --append -m pytest -q -m integration
      # Report only, no floor (DESIGN.md → Testing, "Coverage"). Written to
      # the log and to the run's job summary; skipped when a test step fails,
      # since a partial run's numbers would mislead. bash on both OSes, so the
      # summary redirect is spelled once.
      - name: Coverage report
        shell: bash
        run: |
          python -m coverage report
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lists the PR's commits through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # scan every commit in the PR, not just the tip
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same version as the pre-commit hook. .gitleaks.toml uses the
          # [[allowlists]] format, which the action's older default ignores.
          GITLEAKS_VERSION: "8.30.1"
